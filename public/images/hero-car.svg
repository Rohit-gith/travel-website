<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <!--
    PLACEHOLDER CAR - replace with the client's real car photo.
    Best: transparent PNG (side or 3/4 view), about 1600px wide.
    Save it as public/images/hero-car.png and update HERO_CAR_IMAGE in src/constants/index.js
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4e2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#0b426f"/>
    </linearGradient>
  </defs>

  <ellipse cx="460" cy="358" rx="390" ry="20" fill="#000" opacity="0.35"/>

  <!-- Body -->
  <path d="M55 262C55 228 78 208 118 200L240 186C290 128 355 98 440 98L585 98C655 98 705 138 740 182L815 196C848 203 862 226 862 258L862 282C862 294 853 300 840 300L80 300C65 300 55 294 55 282Z" fill="url(#body)"/>
  <path d="M70 266L850 266" stroke="#0073ca" stroke-width="5" stroke-linecap="round"/>

  <!-- Windows -->
  <path d="M283 190C313 146 360 122 430 120L478 120L478 190Z" fill="url(#glass)"/>
  <path d="M496 120L584 120C632 122 667 150 692 190L496 190Z" fill="url(#glass)"/>

  <!-- Door lines and handles -->
  <path d="M487 124L487 296" stroke="#aab7c8" stroke-width="2"/>
  <path d="M300 196L300 296" stroke="#aab7c8" stroke-width="2"/>
  <rect x="430" y="212" width="36" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="510" y="212" width="36" height="7" rx="3.5" fill="#94a3b8"/>

  <!-- Lights -->
  <path d="M832 220L860 228L860 248L828 244Z" fill="#fde68a"/>
  <rect x="57" y="222" width="18" height="24" rx="5" fill="#ef4444"/>

  <!-- Wheel arches -->
  <circle cx="205" cy="300" r="68" fill="#0f172a"/>
  <circle cx="705" cy="300" r="68" fill="#0f172a"/>

  <!-- Wheels -->
  <circle cx="205" cy="300" r="56" fill="#0b1220"/>
  <circle cx="205" cy="300" r="34" fill="#cbd5e1"/>
  <circle cx="205" cy="300" r="11" fill="#475569"/>
  <circle cx="705" cy="300" r="56" fill="#0b1220"/>
  <circle cx="705" cy="300" r="34" fill="#cbd5e1"/>
  <circle cx="705" cy="300" r="11" fill="#475569"/>
</svg>